version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stanpc_postgres
    environment:
      POSTGRES_USER: stanpc
      POSTGRES_PASSWORD: stanpc_dev_password
      POSTGRES_DB: stanpc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stanpc_network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stanpc_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stanpc.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - stanpc_network

volumes:
  postgres_data:
    driver: local

networks:
  stanpc_network:
    driver: bridge
