<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" fill="#0F0F12"/>

  <!-- Card shape (main icon) -->
  <path d="M 40 30 L 152 30 Q 165 30 165 43 L 165 149 Q 165 162 152 162 L 40 162 Q 27 162 27 149 L 27 43 Q 27 30 40 30 Z"
        fill="url(#cardGradient)" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>

  <!-- Inner shine effect -->
  <rect x="35" y="35" width="122" height="122" rx="8" fill="none"
        stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" opacity="0.5"/>

  <!-- Sparkle dots (✨) -->
  <circle cx="60" cy="55" r="3" fill="#60A5FA" opacity="0.8"/>
  <circle cx="135" cy="50" r="2.5" fill="#93C5FD" opacity="0.7"/>
  <circle cx="145" cy="140" r="2" fill="#BFDBFE" opacity="0.6"/>
  <circle cx="50" cy="130" r="2.5" fill="#60A5FA" opacity="0.7"/>

  <!-- Central design - Photo card silhouette -->
  <g transform="translate(96, 96)">
    <!-- Card outline -->
    <path d="M -35 -35 L 35 -35 L 35 35 L -35 35 Z"
          fill="rgba(96, 165, 250, 0.1)" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Photo area -->
    <rect x="-25" y="-25" width="50" height="50" fill="rgba(59, 130, 246, 0.15)" rx="3"/>

    <!-- Gradient shine -->
    <circle cx="0" cy="0" r="30" fill="url(#innerGlow)" opacity="0.4"/>
  </g>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="innerGlow">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>
